name: Check site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated files match source
        run: python scripts/build.py --check
      - name: SEO, navigation, sitemap and assets
        run: python scripts/check.py
      - name: JavaScript syntax
        run: node --check assets/site.js
